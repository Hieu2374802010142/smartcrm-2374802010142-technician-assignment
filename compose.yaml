services:
  smartcrm:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      SMARTCRM_DB_PATH: /data/smartcrm.db

    volumes:
      - smartcrm_data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(chr(104)+chr(116)+chr(116)+chr(112)+chr(58)+chr(47)+chr(47)+chr(49)+chr(50)+chr(55)+chr(46)+chr(48)+chr(46)+chr(48)+chr(46)+chr(49)+chr(58)+chr(56)+chr(48)+chr(48)+chr(48)+chr(47)+chr(100)+chr(98)+chr(45)+chr(116)+chr(101)+chr(115)+chr(116), timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  smartcrm_data: